# Builds and publishes release artifacts to a GitHub Release. Only ever runs on
# tag pushes matching v* (this repo's tag convention). Never runs on ordinary
# branch pushes or pull requests.
#
# The three package steps are independent of each other (`depends_on: []` puts
# the workflow into DAG mode, so they run concurrently); only
# publish-github-release waits for all of them. freebsd-pkg is listed first
# because it is the slowest (it downloads a FreeBSD base set and the GTK
# package closure before cross-compiling), so it is not left queued behind the
# other two if the agent's concurrency is limited.
#
# The GitHub Release body is rendered from the matching `## v<version>` section
# of RELEASE_NOTES.md by scripts/extract-release-notes.sh. A tag whose version
# has no entry there fails the pipeline instead of publishing an empty release.
#
# Requirements for this to work:
#   - A `github_token` secret is set on this repo in Woodpecker (Project
#     Settings -> Secrets), holding a GitHub PAT scoped to Contents:
#     read/write on TheHolm/md_timesheet, restricted to the "tag" event.
#   - Gitea's push mirror to github.com/TheHolm/md_timesheet is set up and syncs
#     tags promptly, so the tag this workflow is releasing already exists on
#     GitHub.

when:
  - event: tag
    ref: refs/tags/v*

steps:
  - name: freebsd-pkg
    image: rust:1.98-trixie
    depends_on: []
    # Best effort: md_timesheet is Linux/GTK first, and the FreeBSD sysroot is
    # assembled from a package repository whose layout is not a stable public
    # interface. A break here is reported but never blocks the Linux release.
    failure: ignore
    environment:
      CARGO_TARGET_DIR: target/freebsd
      CARGO_TARGET_X86_64_UNKNOWN_FREEBSD_LINKER: clang
      PKG_CONFIG_ALLOW_CROSS: "1"
      PKG_CONFIG_SYSROOT_DIR: /opt/freebsd-sysroot
      PKG_CONFIG_LIBDIR: /opt/freebsd-sysroot/usr/local/libdata/pkgconfig:/opt/freebsd-sysroot/usr/local/lib/pkgconfig
      # --target is passed to clang (not rustc); -B helps clang find the CRT
      # objects. See TheHolm/dak's NOTES.md section 1.5.
      RUSTFLAGS: "-C link-arg=--target=x86_64-unknown-freebsd15 -C link-arg=--sysroot=/opt/freebsd-sysroot -C link-arg=-fuse-ld=lld -C link-arg=-B/opt/freebsd-sysroot/usr/lib"
    commands:
      - rustup target add x86_64-unknown-freebsd
      - apt-get update && apt-get install -y --no-install-recommends clang lld zstd xz-utils python3 ca-certificates
      - mkdir -p /opt/freebsd-sysroot
      # FreeBSD base system for libstd's link-time needs. Every member needs the
      # leading `./`; extract members explicitly, not via a file list. If a
      # future release moves a soname, re-run
      # `tar -tvJf base.txz | grep <libname>` to find the new name.
      - curl -fsSL -o /tmp/base.txz https://download.freebsd.org/releases/amd64/amd64/15.1-RELEASE/base.txz
      - >-
        tar -xJf /tmp/base.txz -C /opt/freebsd-sysroot
        ./lib/libc.so.7 ./usr/lib/libc.so ./usr/lib/libc_nonshared.a
        ./lib/libm.so.5 ./usr/lib/libm.so
        ./lib/libutil.so.10 ./usr/lib/libutil.so
        ./lib/librt.so.1 ./usr/lib/librt.so
        ./usr/lib/libexecinfo.so.1 ./usr/lib/libexecinfo.so
        ./lib/libkvm.so.7 ./usr/lib/libkvm.so
        ./usr/lib/libmemstat.so.3 ./usr/lib/libmemstat.so
        ./usr/lib/libprocstat.so.1 ./usr/lib/libprocstat.so
        ./lib/libdevstat.so.7 ./usr/lib/libdevstat.so
        ./lib/libthr.so.3 ./usr/lib/libthr.so ./usr/lib/libpthread.so
        ./lib/libgcc_s.so.1 ./usr/lib/libgcc_s.so
        ./usr/lib/crt1.o ./usr/lib/Scrt1.o ./usr/lib/crti.o ./usr/lib/crtn.o
        ./usr/lib/crtbegin.o ./usr/lib/crtbeginS.o ./usr/lib/crtbeginT.o
        ./usr/lib/crtend.o ./usr/lib/crtendS.o
      - rm -f /tmp/base.txz
      # GTK4 + libadwaita and their closure, fetched from pkg.freebsd.org.
      - python3 scripts/fetch-freebsd-gtk.py --sysroot /opt/freebsd-sysroot --deps-output /opt/freebsd-deps.json
      - cargo build --release --target x86_64-unknown-freebsd
      - >-
        mkdir -p dist stage-root/usr/local/bin
        stage-root/usr/local/share/doc/md_timesheet
      - cp target/freebsd/x86_64-unknown-freebsd/release/md_timesheet stage-root/usr/local/bin/md_timesheet
      - chmod 555 stage-root/usr/local/bin/md_timesheet
      - cp README.md LICENSE stage-root/usr/local/share/doc/md_timesheet/
      - chmod 644 stage-root/usr/local/share/doc/md_timesheet/README.md stage-root/usr/local/share/doc/md_timesheet/LICENSE
      - >-
        python3 scripts/build-freebsd-pkg.py
        --version "${CI_COMMIT_TAG#v}"
        --stage-root stage-root
        --deps-file /opt/freebsd-deps.json
        --output "dist/md_timesheet-${CI_COMMIT_TAG#v}-freebsd-amd64.pkg"
      # Fail if the binary did not make it into the built .pkg.
      - zstd -dc dist/md_timesheet-*.pkg | tar -tf - | grep -qF 'usr/local/bin/md_timesheet'

  - name: deb-ubuntu2604
    image: ubuntu:26.04
    depends_on: []
    environment:
      CARGO_TARGET_DIR: target/deb-ubuntu2604
    commands:
      - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates build-essential pkg-config libasound2-dev libxcb-xfixes0-dev libxcb-shape0-dev libpango1.0-dev libgtk-4-dev libadwaita-1-dev
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.0
      - . "$HOME/.cargo/env"
      - cargo install cargo-deb --locked
      - mkdir -p dist
      # --deb-revision disambiguates the two .deb outputs; cargo-deb's default
      # naming does not encode the distro, so both steps would otherwise write
      # an identically named file into the shared dist/ and one would be lost.
      - cargo deb --deb-revision "1~ubuntu2604"
      - cp target/deb-ubuntu2604/debian/*.deb dist/
      # Fail the release if the binary did not make it into the .deb.
      - dpkg-deb -c target/deb-ubuntu2604/debian/*.deb | grep -qF 'usr/bin/md_timesheet'

  - name: deb-trixie
    image: rust:1.98-trixie
    depends_on: []
    environment:
      CARGO_TARGET_DIR: target/deb-trixie
    commands:
      - apt-get update && apt-get install -y --no-install-recommends libasound2-dev libxcb-xfixes0-dev libxcb-shape0-dev libpango1.0-dev libgtk-4-dev libadwaita-1-dev
      - cargo install cargo-deb --locked
      - mkdir -p dist
      - cargo deb --deb-revision "1~trixie"
      - cp target/deb-trixie/debian/*.deb dist/
      - dpkg-deb -c target/deb-trixie/debian/*.deb | grep -qF 'usr/bin/md_timesheet'

  - name: publish-github-release
    image: rust:1.98-trixie
    depends_on: [freebsd-pkg, deb-ubuntu2604, deb-trixie]
    environment:
      GH_TOKEN:
        from_secret: github_token
    commands:
      - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl gnupg
      - mkdir -p -m 755 /etc/apt/keyrings
      - curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
      - chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
      - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
      - apt-get update && apt-get install -y --no-install-recommends gh
      - bash scripts/extract-release-notes.sh "$CI_COMMIT_TAG" RELEASE_NOTES.md > /tmp/release-notes.md
      # Create the release, or update it in place when a tag is re-released, so
      # republishing is idempotent.
      - |
        if gh release view "$CI_COMMIT_TAG" --repo TheHolm/md_timesheet >/dev/null 2>&1; then
          gh release edit "$CI_COMMIT_TAG" \
            --repo TheHolm/md_timesheet \
            --title "$CI_COMMIT_TAG" \
            --notes-file /tmp/release-notes.md
          gh release upload "$CI_COMMIT_TAG" dist/* \
            --repo TheHolm/md_timesheet \
            --clobber
        else
          gh release create "$CI_COMMIT_TAG" dist/* \
            --repo TheHolm/md_timesheet \
            --title "$CI_COMMIT_TAG" \
            --notes-file /tmp/release-notes.md
        fi
